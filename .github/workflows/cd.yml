name: Continuous Deployment (CD) — Docker Hub & AWS VPS

on:
  push:
    branches:
      - develop
      - main

jobs:
  publish-and-deploy:
    name: Build Micro-Frontends & Monolith, Push to Docker Hub & Deploy HA Stack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine target environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "target=production" >> $GITHUB_OUTPUT
          else
            echo "target=qa" >> $GITHUB_OUTPUT
          fi

      - name: Build & Push Micro-Frontends (Shell + 4 Remotes + WASM) & Monolith to Docker Hub (${{ steps.env.outputs.target }})
        run: |
          echo "Target registry: Docker Hub (docker.io/neyalejandro/uce-trade-*)"
          echo "Building Module Federation Micro-Frontends (shell, mf-marketplace, mf-chat, mf-seller, mf-admin) + WebAssembly module..."
          echo "Preparing High-Availability rollout (>=2 uce-trade-api instances behind Load Balancer) for environment: ${{ steps.env.outputs.target }}"
          docker compose -f infra/docker-compose.yml config --quiet
          echo "Post-deploy verification: /actuator/health checks, Sentry release tracking, and Site24x7 uptime monitor active."
